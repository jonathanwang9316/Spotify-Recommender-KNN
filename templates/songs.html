<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Recommendations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        h1 {
            font-size: 3em;
            font-weight: bold;
            color: #2980b9; /* Darker blue for the title */
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 0 0 15px rgba(41, 128, 185, 0.8), 0 0 30px rgba(41, 128, 185, 0.8), 0 0 45px rgba(41, 128, 185, 0.8);
        }

        /* Container for Recommendations (Flex row) */
        .recommendations-container {
            display: flex;
            justify-content: space-between; /* Ensures that the cards are spaced equally */
            gap: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 1500px; /* Max width to make sure it doesn't stretch too far */
        }

        /* Individual Recommendation Card (Square) */
        .recommendation-card {
            background-color: #1e1e1e;
            color: #fff;
            padding: 30px;
            width: 280px; /* Smaller width to fit more cards */
            height: 280px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .recommendation-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .recommendation-card h3 {
            font-size: 1.8em;
            margin-bottom: 15px;
            color: #74b9ff; /* Light blue color */
            text-shadow: 0 0 10px #74b9ff, 0 0 20px #74b9ff, 0 0 30px #74b9ff;
        }

        .recommendation-card p {
            font-size: 1.3em;
            margin-bottom: 10px;
            color: #bbb;
        }

        .recommendation-card .genre {
            font-size: 1.2em;
            color: #888;
        }

        /* Button Styles */
        .button {
            display: flex;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.5em;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
            background-color: #1DB954; /* Green color for the buttons */
            box-shadow: 0 0 10px #1DB954, 0 0 20px #1DB954;
        }

        .button:hover {
            opacity: 0.8;
            text-shadow: 0 0 15px #1DB954, 0 0 30px #1DB954, 0 0 45px #1DB954;
        }

        .back {
            background-color: transparent;
            border: 2px solid #7f8c8d;
            box-shadow: none;
        }

        /* Genre and Artist Buttons (Updated to Blue for consistency) */
        .genre, .artist {
            background-color: #74b9ff; /* Blue for genre and artist buttons */
        }

        /* Add Sound Wave Design in Background */
        .background-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/vertical-stripes.png'), linear-gradient(90deg, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.6));
            z-index: -1;
            animation: soundWave 3s ease-in-out infinite;
        }

        @keyframes soundWave {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
            100% {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Background Effect -->
    <div class="background-effect"></div>

    <!-- Page Title -->
    <h1>Song Recommendations</h1>

    <!-- Song Recommendations -->
    <div class="recommendations-container">
        <div class="recommendation-card">
            <h3>Song Title 1</h3>
            <p>Artist Name</p>
            <p>Genre</p>
        </div>
        <div class="recommendation-card">
            <h3>Song Title 2</h3>
            <p>Artist Name</p>
            <p>Genre</p>
        </div>
        <div class="recommendation-card">
            <h3>Song Title 3</h3>
            <p>Artist Name</p>
            <p>Genre</p>
        </div>
        <div class="recommendation-card">
            <h3>Song Title 4</h3>
            <p>Artist Name</p>
            <p>Genre</p>
        </div>
        <div class="recommendation-card">
            <h3>Song Title 5</h3>
            <p>Artist Name</p>
            <p>Genre</p>
        </div>
    </div>

    <!-- Navigation Buttons -->
    <div class="navigation-buttons">
        <a href="{{ url_for('home') }}" class="button back">🔙 Back to Home</a>
        <a href="{{ url_for('genres') }}" class="button genre">🎼 Genre Recommendations</a>
        <a href="{{ url_for('artists') }}" class="button artist">🎤 Artist Recommendations</a>
    </div>

</body>
</html>
