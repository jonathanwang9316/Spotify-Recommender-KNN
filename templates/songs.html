<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Recommendations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
        }

        /* Left Section */
        .left {
            width: 50%;
            background-color: #f6b654;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .left h1 {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
        }

        .left p {
            margin-top: 10px;
            color: #444;
            font-size: 1.2em;
        }

        .spotify-btn {
            margin-top: 20px;
            background-color: #1DB954;
            color: white;
            padding: 12px 20px;
            font-size: 1.2em;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .spotify-btn:hover {
            background-color: #189e46;
        }

        /* Right Section */
        .right {
            width: 50%;
            background-color: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
        }

        .button {
            display: flex;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.5em;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }

        .button:hover {
            opacity: 0.8;
        }

        .back {
            background-color: #7f8c8d;
        }

        .recommendation-card {
            background-color: #222;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            width: 80%;
            margin-top: 20px;
        }

        .recommendation-card h2 {
            color: #1DB954;
            font-size: 1.5em;
        }

        .spotify-embed {
            margin-top: 10px;
            width: 100%;
            height: 80px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Left Section (Spotify Login) -->
    <div class="left">
        <h1>Song Recommendations</h1>
        <p>Hey {{ user_name }}, here are some song recommendations based on your Spotify preferences.</p>
        <a href="{{ auth_url }}">
            <button class="spotify-btn">Connect to Spotify</button>
        </a>
    </div>

    <!-- Right Section (Navigation Button) -->
    <div class="right">
        <a href="{{ url_for('home') }}" class="button back">🔙 Back to Home</a>
        <!-- You can add your song recommendations here dynamically -->

        {% if song_rec_url %}
        <div class="recommendation-card">
            <h2>Song #1 🎵</h2>
            <iframe class="spotify-embed" src="{{ song_rec_url }}" frameborder="0"
                    allowtransparency="true" allow="autoplay; clipboard_write; encrypted-media;" loading="eager">
            </iframe>
            {% else %}
            <p>No recommendations available right now.</p>
            {% endif %}
        </div>
    </div>



</body>
</html>
