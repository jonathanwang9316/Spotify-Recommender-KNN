<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Recommendations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
        }

        /* Left Section */
        .left {
            width: 50%;
            background-color: #f6b654;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .left h1 {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
        }

        .left p {
            margin-top: 10px;
            color: #444;
            font-size: 1.2em;
        }

        .spotify-btn {
            margin-top: 20px;
            background-color: #1DB954;
            color: white;
            padding: 12px 20px;
            font-size: 1.2em;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .spotify-btn:hover {
            background-color: #189e46;
        }

        /* Right Section */
        .right {
            width: 50%;
            background-color: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
        }

        .button {
            display: flex;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.5em;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }

        .button:hover {
            opacity: 0.8;
        }

        .back {
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>

    <!-- Left Section (Spotify Login) -->
    <div class="left">
        <h1>Artist Recommendations</h1>
        <p>Hey {{ user_name }}, discover new music based on your favorite artists.</p>
        <button class="spotify-btn">Login with Spotify</button>
    </div>

    <div class="right">
        <a href="{{ url_for('home') }}" class="button back">🔙 Back to Home</a>
        <!-- You can add your genre recommendations here dynamically -->
    </div>
