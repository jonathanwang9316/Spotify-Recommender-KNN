<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Recommendation</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
            color: #333;
        }
        header {
            background-color: #8e44ad;
            color: white;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        header h1 {
            margin: 0;
            font-size: 36px;
        }
        header p {
            font-size: 18px;
            margin: 10px 0 0;
        }
        nav {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 10px 0;
        }
        nav a {
            color: white;
            font-size: 16px;
            text-decoration: none;
            padding: 12px 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        nav a:hover {
            background-color: #3498db;
            color: #fff;
            border-radius: 4px;
        }
        .container {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .recommendations {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }
        .recommendation-card {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .recommendation-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
        }
        .recommendation-card h3 {
            font-size: 20px;
            margin: 0;
            color: #2c3e50;
        }
        .recommendation-card p {
            font-size: 16px;
            margin: 5px 0;
            color: #7f8c8d;
        }
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px 0;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Music Recommendation</h1>
        <p>Discover new tunes, tailored to your vibe</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Genres</a>
        <a href="#">Artists</a>
        <a href="#">Playlists</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">
        <h2 style="text-align:center;">Recommended Music</h2>
        <div class="recommendations">
            <!-- Example Recommendation Cards -->
            <div class="recommendation-card">
                <h3>Song Title 1</h3>
                <p>Artist Name</p>
                <p>Genre: Pop</p>
            </div>
            <div class="recommendation-card">
                <h3>Song Title 2</h3>
                <p>Artist Name</p>
                <p>Genre: Rock</p>
            </div>
            <div class="recommendation-card">
                <h3>Song Title 3</h3>
                <p>Artist Name</p>
                <p>Genre: Jazz</p>
            </div>
        </div>
    </div> 

    <footer>
        <p>&copy; 2025 Music Recommendation Website | All rights reserved</p>
    </footer>
</body>
</html>
